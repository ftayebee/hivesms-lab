# Single-host (VPS) deployment: MariaDB, a one-shot migration job, the web app and the worker.
# For Hostinger Business web hosting (no Docker) see docs/07-hostinger-deployment.md.
#
#   cp .env.example .env.production   # fill in real secrets (see docs/04-deployment.md)
#   docker compose --env-file .env.production up -d --build
#
# Put a TLS-terminating reverse proxy (Caddy, nginx, a cloud load balancer) in front of
# `web`; the app sets HSTS and secure cookies and expects HTTPS in production.

name: smsflow

x-app-env: &app-env
  env_file: .env.production
  environment:
    DATABASE_URL: mysql://${MYSQL_USER:-smsflow}:${MYSQL_PASSWORD:?set MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE:-smsflow}
    LOCAL_DATA_DIR: /app/data
    # The dedicated worker service runs background jobs; keep them out of the web process.
    WORKER_IN_PROCESS: "false"

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_USER: ${MYSQL_USER:-smsflow}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      MARIADB_DATABASE: ${MYSQL_DATABASE:-smsflow}
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Not published to the host. Use `docker compose exec db mariadb -u root -p` for access.

  migrate:
    build: { context: ., target: tools, args: { APP_URL: "${APP_URL:?set APP_URL}" } }
    image: smsflow-tools
    <<: *app-env
    # Applies migrations, then the idempotent bootstrap (permissions, example pricing, optional first admin).
    command: ["sh", "-c", "npx prisma migrate deploy && npm run db:bootstrap"]
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  web:
    build: { context: ., target: web, args: { APP_URL: "${APP_URL:?set APP_URL}" } }
    image: smsflow-web
    <<: *app-env
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - appdata:/app/data
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  worker:
    build: { context: ., target: tools, args: { APP_URL: "${APP_URL:?set APP_URL}" } }
    image: smsflow-tools
    <<: *app-env
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - appdata:/app/data
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

volumes:
  dbdata:
  appdata:
